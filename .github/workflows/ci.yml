name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# `shell: bash` runs steps with -eo pipefail, so a failed curl fails the install.
defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Native installer, https://code.claude.com/docs/en/setup
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate marketplace
        run: claude plugin validate . --strict

      - name: Validate each plugin
        run: |
          for dir in plugins/*/; do
            echo "::group::${dir}"
            claude plugin validate "${dir%/}" --strict
            echo "::endgroup::"
          done

      # Function-hook plugins carry *.test.ts(x) files run by `claude plugin test`.
      - name: Function-hook plugin tests
        run: |
          claude plugin test plugins/kc-usage-band
          claude plugin test plugins/kc-image-preview

  rules-in-sync:
    name: Generated rules match their skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check rules/ against skills/
        run: bash plugins/kc-conventions/scripts/build-rules.sh --check

      # Box ids unique, every rule detail has a box, every § citation and
      # named script resolves (scripts/lint-rules.sh).
      - name: Rules lint
        run: bash scripts/lint-rules.sh

  scripts:
    name: Shell scripts and their tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # shellcheck ships on the ubuntu-24.04 runner image (actions/runner-images).
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck

      - name: Version bump check tests
        run: bash scripts/tests/check-version-bumps.test.sh

      - name: Lesson proof check tests
        run: bash scripts/tests/check-lesson-proof.test.sh

      - name: Changed-eval runner tests
        run: bash scripts/tests/run-changed-evals.test.sh

      - name: Rules lint and coverage check tests
        run: bash scripts/tests/lint-rules.test.sh

      - name: Every plugin script has a test
        run: bash scripts/check-test-coverage.sh

      - name: Convention sweep fixtures
        run: bash plugins/kc-conventions/tests/run-sweeps.sh

      # Every top-level *.sh in a plugin's tests/ is a runner; helpers and
      # fixtures live in subdirectories. Plugins with no tests are skipped.
      - name: Plugin test runners
        run: |
          shopt -s nullglob
          for runner in plugins/*/tests/*.sh; do
            if [ "$runner" = plugins/kc-conventions/tests/run-sweeps.sh ]; then
              continue
            fi
            echo "::group::${runner}"
            bash "$runner"
            echo "::endgroup::"
          done

  version-bumps:
    name: Changed plugins bump their version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Installed plugins update only when their version goes up, so an unbumped change never
      # reaches anyone.
      - name: Compare each changed plugin's version with the base branch
        run: bash scripts/check-version-bumps.sh "origin/$GITHUB_BASE_REF"

  lesson-proof:
    name: Rule changes carry proof
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A rule edit needs an eval case or a script test beside it, each changed box an eval or test
      # naming its id, and a rule file that gains lines a box, or else a `wording-only: <why>` line
      # in the description. Edited descriptions re-run it on the next push. The body goes through
      # an environment variable, never into the script text.
      - name: Check rule edits against evals, tests and the description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          bash scripts/check-lesson-proof.sh "origin/$GITHUB_BASE_REF" --body-file "$RUNNER_TEMP/pr-body.md"

  # Each eval case a pull request adds or changes carries a proof.json from a local run of
  # scripts/run-changed-evals.sh: passed with its plugin, failed without it, made from the case and
  # plugin code at the head commit. Nothing runs here and no key is needed.
  changed-evals:
    name: Changed eval cases carry a passing run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check each changed case's record
        run: bash scripts/run-changed-evals.sh "origin/$GITHUB_BASE_REF" --check
