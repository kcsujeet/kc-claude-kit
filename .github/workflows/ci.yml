name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin whose eval suite to run (costs model calls)
        required: true
        type: choice
        options:
          - kc-gates
          - kc-conventions

permissions:
  contents: read

# `shell: bash` runs steps with -eo pipefail, so a failed curl fails the install.
defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Native installer, https://code.claude.com/docs/en/setup
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate marketplace
        run: claude plugin validate . --strict

      - name: Validate each plugin
        run: |
          for dir in plugins/*/; do
            echo "::group::${dir}"
            claude plugin validate "${dir%/}" --strict
            echo "::endgroup::"
          done

      # Function-hook plugins carry *.test.ts(x) files run by `claude plugin test`.
      - name: Function-hook plugin tests
        run: |
          claude plugin test plugins/kc-usage-band
          claude plugin test plugins/kc-image-preview

  rules-in-sync:
    name: Generated rules match their skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check rules/ against skills/
        run: bash plugins/kc-conventions/scripts/build-rules.sh --check

  scripts:
    name: Shell scripts and their tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # shellcheck ships on the ubuntu-24.04 runner image (actions/runner-images).
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck

      - name: Version bump check tests
        run: bash scripts/tests/check-version-bumps.test.sh

      - name: Convention sweep fixtures
        run: bash plugins/kc-conventions/tests/run-sweeps.sh

      # Every top-level *.sh in a plugin's tests/ is a runner; helpers and
      # fixtures live in subdirectories. Plugins with no tests are skipped.
      - name: Plugin test runners
        run: |
          shopt -s nullglob
          for runner in plugins/*/tests/*.sh; do
            if [ "$runner" = plugins/kc-conventions/tests/run-sweeps.sh ]; then
              continue
            fi
            echo "::group::${runner}"
            bash "$runner"
            echo "::endgroup::"
          done

  version-bumps:
    name: Changed plugins bump their version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Installed plugins update only when their version goes up, so an unbumped change never
      # reaches anyone.
      - name: Compare each changed plugin's version with the base branch
        run: bash scripts/check-version-bumps.sh "origin/$GITHUB_BASE_REF"

  evals:
    name: Plugin evals
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PLUGIN: ${{ inputs.plugin }}
    steps:
      # The secrets context is not available in a job-level `if`, so the
      # check runs as a step and gates the rest.
      - name: Check for ANTHROPIC_API_KEY
        id: key
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ANTHROPIC_API_KEY secret is not set; skipping evals."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'

      # bubblewrap and socat back the OS sandbox that Bash-granting cases need
      # on Linux (https://code.claude.com/docs/en/plugin-evals).
      - name: Install Claude Code and sandbox prerequisites
        if: steps.key.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # CI form from https://code.claude.com/docs/en/plugin-evals.
      # kc-gates cases load kc-conventions too (plugins: ["../..",
      # "../../../kc-conventions"]), and the runner only loads plugins inside its
      # containment root: the target plugin when the target is a plugin, else
      # the directory the eval runs against. So kc-gates runs from the repo
      # root with --eval-dir. Its cases also build fixture repos with scaffold
      # scripts, run git through Bash and dispatch gate agents.
      # --allow-tools takes a list, so it stays last among these flags.
      - name: Run eval suite
        if: steps.key.outputs.present == 'true'
        run: |
          target=("plugins/$PLUGIN")
          extra_flags=()
          if [ "$PLUGIN" = kc-gates ]; then
            target=(. --eval-dir plugins/kc-gates/evals --ablation with-without)
            extra_flags+=(--scaffold --allow-tools Bash Agent)
          fi
          claude plugin eval "${target[@]}" \
            --trust-plugin \
            --json results.json \
            --threshold 0.8 \
            --model claude-sonnet-5 \
            --judge-model claude-haiku-4-5 \
            --no-publish \
            --max-cost-usd 10 \
            "${extra_flags[@]}"

      - name: Upload results
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: eval-results-${{ inputs.plugin }}
          path: results.json
          if-no-files-found: warn
