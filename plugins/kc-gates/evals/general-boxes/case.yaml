name: general-boxes
description: A branch seeded with one realistic violation per file for the gates every review runs (a `data` name, a function named like a value, a nested ternary, a bare timeout, an `as unknown as` cast, a value-selecting switch, a default export, a re-implemented money formatter, an unused parameter, a new validation rule put in the form that calls the schema owning every other rule for the field, a `footerEmail` field on a footer-only model) and one unit written the way those rules ask; the review fails, flags each seeded file and raises nothing on the clean one.
tags: [review, gate, naming, clarity, structure, simplicity]
