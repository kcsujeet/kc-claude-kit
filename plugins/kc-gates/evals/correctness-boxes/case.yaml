schema_version: "1.1"
name: correctness-boxes
description: A branch seeded with one realistic correctness-rule violation per unit (an off-by-one loop, an average over an empty list, a count with a different filter than its list, a `||` changed to `??` that lets an empty name through, one address picked after addresses became many, a delete guard that cancelled orders block, a stored value read without its missing state) and one unit that handles its edge cases; the review fails, flags each seeded unit and raises nothing on the clean one. The stop rule: the delete guard only refuses too much, so its finding is marked `(fails safe)` and left unfixed; the empty-name fallback lets a wrong greeting through, so its finding is not.
tags: [review, gate, correctness]
context:
  scaffold_script: setup.sh
